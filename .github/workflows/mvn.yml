name: Build native MVN tests
on:
  push:
    branches: [validate-mvn-35026]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c755364d3948017433ba97df98a7be69f75fb028
          persist-credentials: false
      - name: Prepare OpenVINO dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git submodule update --init --depth 1 --jobs 6 thirdparty/gtest/gtest thirdparty/gflags/gflags thirdparty/json/nlohmann_json thirdparty/pugixml thirdparty/ocl/icd_loader thirdparty/ocl/cl_headers thirdparty/ocl/clhpp_headers thirdparty/ittapi/ittapi thirdparty/xbyak thirdparty/snappy thirdparty/zlib/zlib thirdparty/level_zero/level-zero src/plugins/intel_gpu/thirdparty/TernOCL
      - name: Configure and build the GPU unit tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B D:\b -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON -DENABLE_INTEL_GPU=ON -DGPU_RT_TYPE=OCL -DENABLE_INTEL_CPU=OFF -DENABLE_INTEL_NPU=OFF -DENABLE_ONEDNN_FOR_GPU=OFF -DENABLE_FUNCTIONAL_TESTS=OFF -DENABLE_AUTO=OFF -DENABLE_AUTO_BATCH=OFF -DENABLE_HETERO=OFF -DENABLE_MULTI=OFF -DENABLE_OV_ONNX_FRONTEND=OFF -DENABLE_OV_TF_FRONTEND=OFF -DENABLE_OV_TF_LITE_FRONTEND=OFF -DENABLE_OV_PADDLE_FRONTEND=OFF -DENABLE_OV_PYTORCH_FRONTEND=OFF -DENABLE_OV_JAX_FRONTEND=OFF -DENABLE_OV_GGUF_FRONTEND=OFF -DENABLE_SAMPLES=OFF -DENABLE_PYTHON=OFF -DENABLE_JS=OFF -DENABLE_LTO=OFF -DENABLE_FASTER_BUILD=ON -DENABLE_PROFILING_ITT=OFF -DTHREADING=SEQ -DENABLE_CLANG_FORMAT=OFF -DENABLE_NCC_STYLE=OFF || exit /b 1
          cmake --build D:\b --target ov_gpu_unit_tests --parallel 4 || exit /b 1
      - name: Collect the executable and runtime DLLs
        shell: pwsh
        run: |
          $exe = Get-ChildItem bin -Recurse -Filter ov_gpu_unit_tests.exe | Select-Object -First 1
          if (!$exe) { throw 'GPU test executable missing' }
          New-Item -ItemType Directory artifact | Out-Null
          Copy-Item -LiteralPath $exe.FullName -Destination artifact
          Get-ChildItem bin -Recurse -Filter *.dll | Copy-Item -Destination artifact -Force
          & $exe.FullName --gtest_list_tests '--gtest_filter=*mvn_scale_shift*'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: mvn-native-tests
          path: artifact
          retention-days: 3
